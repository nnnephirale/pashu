<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Hi-Res</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-a:#FAFAF8; --bg-b:#F2F1ED;
  --surface:#FFFFFF;
  --ink:#1C1A17; --ink-2:#6B665F; --ink-3:#A8A29A;
  --line:rgba(0,0,0,0.04);
  --line-2:rgba(0,0,0,0.07);
  --fill:#EFEDE8;
  --fill-2:#E4E1DA;
  --accent:#8C8578;
  --rose:#B4746E;
  --r-lg:20px; --r-md:14px; --r-sm:9px;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --shadow-soft:0 1px 2px rgba(28,26,23,.04), 0 6px 16px rgba(28,26,23,.05), 0 24px 48px rgba(28,26,23,.05);
  --panel-w:332px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-weight:300;
  font-size:12px;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg-a) 0%,var(--bg-b) 100%);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- stage ---------- */
.stage{
  position:fixed; inset:0 var(--panel-w) 0 0;
  display:flex; align-items:center; justify-content:center;
  padding:44px 40px 76px;
}
.canvas-wrap{
  position:relative;
  border-radius:4px;
  box-shadow:0 2px 6px rgba(28,26,23,.06), 0 18px 44px rgba(28,26,23,.10), 0 44px 90px rgba(28,26,23,.06);
  line-height:0;
  transition:box-shadow .5s var(--ease);
}
canvas{ display:block; max-width:100%; max-height:100%; border-radius:3px; }

.size-bar{
  position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
  display:flex; align-items:center; gap:4px;
  padding:6px 8px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line); border-radius:999px;
  box-shadow:var(--shadow-soft);
  opacity:0; transform:translateX(-50%) translateY(6px);
  transition:opacity .35s var(--ease), transform .35s var(--ease);
}
.stage:hover .size-bar{opacity:1; transform:translateX(-50%) translateY(0)}
.size-bar label{display:flex;align-items:center;gap:5px;color:var(--ink-3);padding-left:8px}
.size-bar input{
  width:52px; border:0; background:transparent; font:inherit; color:var(--ink-3);
  text-align:center; padding:4px 2px; border-radius:var(--r-sm);
  transition:color .2s var(--ease), background .2s var(--ease);
}
.size-bar input:hover{background:var(--fill)}
.size-bar input:focus{outline:0;color:var(--ink);background:var(--fill)}
.size-bar select{
  border:0;background:transparent;font:inherit;color:var(--ink-3);
  padding:4px 6px;border-radius:var(--r-sm);cursor:pointer;
}
.size-bar select:hover{background:var(--fill);color:var(--ink)}
.size-bar input::-webkit-outer-spin-button,
.size-bar input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------- panel ---------- */
.panel{
  position:fixed; top:14px; right:14px; bottom:14px; width:calc(var(--panel-w) - 28px);
  display:flex; flex-direction:column;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-soft);
  overflow:hidden;
}
.panel-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  padding:16px 16px 12px;
  border-bottom:1px solid var(--line);
}
.panel-title h1{margin:0;font-size:12px;font-weight:500;letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-title p{margin:3px 0 0;font-size:10px;color:var(--ink-3);letter-spacing:.02em}
.ghost-btn{
  font:inherit;font-size:10px;color:var(--ink-3);
  background:transparent;border:1px solid transparent;
  padding:4px 8px;border-radius:var(--r-sm);cursor:pointer;
  transition:all .25s var(--ease);
}
.ghost-btn:hover{color:var(--rose);border-color:rgba(180,116,110,.28)}
.ghost-btn:active{transform:scale(.97)}

.panel-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 0 16px}
.panel-body::-webkit-scrollbar{width:8px}
.panel-body::-webkit-scrollbar-thumb{background:var(--fill-2);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
.panel-body::-webkit-scrollbar-thumb:hover{background:#D6D2C9;background-clip:padding-box}

.panel-foot{
  display:flex;gap:6px;padding:10px 12px;
  border-top:1px solid var(--line);
  background:rgba(255,255,255,.5);
}
.pbtn{
  flex:1;font:inherit;font-size:11px;color:var(--ink-2);
  background:var(--fill);border:1px solid var(--line);
  padding:8px 6px;border-radius:var(--r-sm);cursor:pointer;
  transition:all .25s var(--ease);
}
.pbtn:hover{background:var(--fill-2);color:var(--ink)}
.pbtn:active{transform:scale(.98)}

.pbtn.save{flex:0 0 auto;padding-left:12px;padding-right:12px}
.pbtn.save:disabled{opacity:.5;cursor:default}
.pbtn.save.dirty{
  color:var(--rose);border-color:rgba(180,116,110,.3);background:rgba(180,116,110,.07);
}
.pbtn.save.dirty:hover{background:rgba(180,116,110,.12)}
/* a quiet standing reminder that leaving now discards the edits */
body.unsaved .panel{box-shadow:var(--shadow-soft),0 0 0 1px rgba(180,116,110,.25)}

/* ---------- sections ---------- */
.section{border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0}
.section-head{
  position:relative;
  display:flex;align-items:center;
}
/* the toggle fills the row — click anywhere on the header to collapse */
.section-toggle{
  flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;
  font:inherit;font-size:11px;font-weight:400;letter-spacing:.04em;
  color:var(--ink-2);background:transparent;border:0;
  padding:13px 16px;cursor:pointer;text-align:left;
  transition:color .25s var(--ease);
}
.section-toggle:hover{color:var(--ink)}
.chev{
  flex:none;width:8px;height:8px;
  border-right:1px solid currentColor;border-bottom:1px solid currentColor;
  transform:rotate(45deg) translate(-2px,-2px);
  transition:transform .3s var(--ease);opacity:.5;
}
.section.open .chev{transform:rotate(225deg) translate(-1px,-1px)}
/* floats over the toggle rather than sitting beside it, so it can't
   punch a dead zone in the header's hit area */
.section-reset{
  position:absolute;right:34px;top:50%;transform:translateY(-50%);
  font:inherit;font-size:12px;line-height:1;
  color:var(--ink-3);background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:4px 7px;cursor:pointer;
  transition:color .25s var(--ease),border-color .25s var(--ease),
             background .25s var(--ease);
}
.section-reset:hover{color:var(--rose);border-color:rgba(180,116,110,.35);background:rgba(180,116,110,.05)}
.section-reset:active{transform:translateY(-50%) scale(.94)}
.section-reset:focus-visible{outline:1px solid var(--rose);outline-offset:1px}
.section-body{display:none;padding:0 16px 14px}
.section.open .section-body{display:block}

/* ---------- rows ---------- */
.row{margin:0 0 6px}
.row:last-child{margin-bottom:0}

/* slider: filled background row, scrub anywhere */
.slider{
  position:relative;display:flex;align-items:center;justify-content:space-between;
  gap:8px;height:30px;padding:0 10px;border-radius:var(--r-sm);
  background:var(--fill);overflow:hidden;cursor:ew-resize;
  user-select:none;-webkit-user-select:none;touch-action:none;
  transition:background .25s var(--ease);
}
.slider:hover{background:var(--fill-2)}
.slider .fill{
  position:absolute;left:0;top:0;bottom:0;width:0;
  background:#DEDAD1;pointer-events:none;
  transition:background .25s var(--ease);
}
.slider:hover .fill{background:#D4CFC4}
.slider.dragging .fill{background:#CBC5B8}
.slider .lab,.slider .val{position:relative;pointer-events:none;white-space:nowrap}
.slider .lab{color:var(--ink-2);font-weight:300}
.slider .val{color:var(--ink-3);font-variant-numeric:tabular-nums;transition:color .2s var(--ease)}
.slider:hover .val{color:var(--ink)}

/* locked: forced to an effective value by the current mode. Reads as inert
   rather than broken — no scrub cursor, no hover lift, value dimmed. */
.slider.locked{cursor:default;background:rgba(0,0,0,.018)}
.slider.locked:hover{background:rgba(0,0,0,.018)}
.slider.locked .fill{background:#E7E4DD}
.slider.locked:hover .fill{background:#E7E4DD}
.slider.locked .lab,.slider.locked .val{color:var(--ink-3);opacity:.6}
.slider.locked::after{
  content:"";position:absolute;right:0;top:0;bottom:0;width:2px;
  background:repeating-linear-gradient(135deg,rgba(0,0,0,.10) 0 2px,transparent 2px 4px);
}
.sel.locked{opacity:.45}
.sel.locked select{cursor:default}
.seg.locked{opacity:.45}
.seg.locked .seg-group button{cursor:default}
.num.locked{opacity:.5}
.num.locked input{cursor:default}
.num.locked input:hover{background:transparent}

/* plain inline number */
.num{display:flex;align-items:center;justify-content:space-between;gap:8px;height:30px;padding:0 10px}
.num label{color:var(--ink-2)}
.num input{
  width:62px;border:0;background:transparent;font:inherit;color:var(--ink-3);
  text-align:right;padding:4px 6px;border-radius:var(--r-sm);
  font-variant-numeric:tabular-nums;
  transition:color .2s var(--ease),background .2s var(--ease);
}
.num input:hover{background:var(--fill)}
.num input:focus{outline:0;color:var(--ink);background:var(--fill)}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* inline toggle */
.tog{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;cursor:pointer;border-radius:var(--r-sm);transition:background .25s var(--ease)}
.tog:hover{background:var(--fill)}
.tog input{appearance:none;-webkit-appearance:none;margin:0;width:13px;height:13px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);cursor:pointer;position:relative;transition:all .2s var(--ease);flex:none}
.tog input:checked{background:var(--accent);border-color:var(--accent)}
.tog input:checked::after{content:"";position:absolute;left:4px;top:1px;width:3px;height:7px;border-right:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(42deg)}
.tog span{color:var(--ink-2)}

/* mode toggle — the top-level choice, so it sits above every section */
.row.mode-bar{
  margin:0;padding:12px 16px;
  border-bottom:1px solid var(--line);
  background:rgba(0,0,0,.012);
}
.row.mode-bar .seg{padding:0;min-height:0}
.row.mode-bar .seg>span{display:none}
.row.mode-bar .seg-group{flex:1;padding:3px}
.row.mode-bar .seg-group button{flex:1;font-size:11px;padding:7px 8px;letter-spacing:.02em}

/* segmented */
.seg{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 10px 4px 10px;min-height:30px}
.seg>span{color:var(--ink-2);white-space:nowrap}
.seg-group{display:flex;background:var(--fill);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg-group button{
  font:inherit;font-size:10px;color:var(--ink-3);background:transparent;border:0;
  padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap;
  transition:all .25s var(--ease);
}
.seg-group button:hover{color:var(--ink)}
.seg-group button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(28,26,23,.06)}

/* select */
.sel{display:flex;align-items:center;justify-content:space-between;gap:8px;height:30px;padding:0 6px 0 10px}
.sel label{color:var(--ink-2)}
.sel select{
  font:inherit;font-size:11px;color:var(--ink-2);background:var(--fill);
  border:1px solid transparent;border-radius:var(--r-sm);padding:5px 8px;cursor:pointer;
  transition:all .25s var(--ease);
}
.sel select:hover{background:var(--fill-2);color:var(--ink)}
.sel select:focus{outline:0;border-color:var(--line-2)}

/* button row */
.btnrow{display:flex;gap:6px;padding:4px 10px}
.btnrow button{
  flex:1;font:inherit;font-size:10px;color:var(--ink-2);background:var(--fill);
  border:1px solid var(--line);padding:7px 6px;border-radius:var(--r-sm);cursor:pointer;
  transition:all .25s var(--ease);
}
.btnrow button:hover{background:var(--fill-2);color:var(--ink)}
.btnrow button:active{transform:scale(.98)}
.btnrow button.danger{background:transparent;border-color:rgba(180,116,110,.25);color:var(--rose)}
.btnrow button.danger:hover{background:rgba(180,116,110,.06)}

/* thumbs */
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 10px 2px}
.thumb{
  position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;
  border:1px solid var(--line);background:var(--fill);cursor:pointer;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),opacity .25s var(--ease);
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(28,26,23,.12)}
.thumb.off{opacity:.28}
.thumb .x{
  position:absolute;top:1px;right:1px;width:13px;height:13px;border-radius:4px;
  background:rgba(255,255,255,.9);color:var(--rose);font-size:10px;line-height:13px;text-align:center;
  opacity:0;transition:opacity .2s var(--ease);
}
.thumb:hover .x{opacity:1}
.hint{padding:4px 10px 0;font-size:10px;color:var(--ink-3);letter-spacing:.01em;line-height:1.5}
.strip-empty{
  grid-column:1 / -1;
  display:flex;align-items:center;justify-content:center;
  min-height:52px;padding:0 10px;text-align:center;
  font-size:10px;line-height:1.5;color:var(--ink-3);
  border:1px dashed var(--line-2);border-radius:var(--r-sm);
  background:rgba(0,0,0,.012);
}

/* share modal */
.modal{
  position:fixed;inset:0;z-index:70;display:none;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.modal.on{display:flex}
.modal-card{
  width:min(520px,100%);background:var(--surface);
  border-radius:var(--r-lg);border:1px solid var(--line);
  box-shadow:0 8px 24px rgba(0,0,0,.18),0 40px 90px rgba(0,0,0,.16);
  overflow:hidden;
}
.modal-card header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 14px;border-bottom:1px solid var(--line);
}
.modal-card h2{margin:0;font-size:12px;font-weight:500;letter-spacing:.02em}
.modal-card header button{
  font:inherit;font-size:16px;line-height:1;color:var(--ink-3);
  background:transparent;border:0;cursor:pointer;padding:2px 4px;
  transition:color .25s var(--ease);
}
.modal-card header button:hover{color:var(--ink)}
#shareBody{padding:14px 18px 18px}
.url-row{margin-bottom:14px}
.url-label{font-size:11px;color:var(--ink);margin-bottom:6px}
.url-label span{color:var(--ink-3);margin-left:8px;font-size:10px}
.url-box{display:flex;gap:6px}
.url-box input{
  flex:1;min-width:0;font:inherit;font-size:11px;color:var(--ink-2);
  background:var(--fill);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 10px;
}
.url-box input:focus{outline:0;border-color:var(--line-2);color:var(--ink)}
.url-box button{
  font:inherit;font-size:11px;color:var(--ink-2);background:var(--fill);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 14px;cursor:pointer;
  transition:all .25s var(--ease);
}
.url-box button:hover{background:var(--fill-2);color:var(--ink)}
.share-note{margin:8px 0 0;font-size:10px;line-height:1.6;color:var(--ink-3)}
.share-note.err{color:var(--rose)}

/* play-only: the canvas is the whole page */
body.view-only .panel,
body.view-only .size-bar{display:none}
body.view-only .stage{inset:0;padding:0}
body.view-only .canvas-wrap{border-radius:0;box-shadow:none}

/* drop veil + toast */
.drop-veil{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;
}
.drop-veil.on{display:flex}
.drop-veil span{
  background:#fff;color:var(--ink);padding:18px 30px;border-radius:var(--r-lg);
  box-shadow:0 8px 24px rgba(0,0,0,.18),0 32px 80px rgba(0,0,0,.14);letter-spacing:.04em;
}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);
  display:flex;align-items:center;gap:12px;
  background:rgba(28,26,23,.9);color:#F5F3EF;font-size:11px;letter-spacing:.02em;
  padding:8px 8px 8px 16px;border-radius:999px;backdrop-filter:blur(12px);
  opacity:0;pointer-events:none;transition:opacity .4s var(--ease),transform .4s var(--ease);z-index:60;
}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{
  font:inherit;font-size:11px;color:#E8A9A3;background:transparent;
  border:1px solid rgba(232,169,163,.3);border-radius:999px;
  padding:4px 12px;cursor:pointer;
  transition:background .25s var(--ease),color .25s var(--ease);
}
.toast button:hover{background:rgba(232,169,163,.14);color:#F3C6C1}
.toast button:active{transform:scale(.97)}
.toast button[hidden]{display:none}

@media (max-width:900px){
  :root{--panel-w:0px}
  .stage{inset:0 0 46vh 0;padding:16px}
  .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:calc(46vh - 16px)}
}

</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="c"></canvas>
  </div>
  <div class="size-bar" id="sizeBar">
    <label>W <input type="number" id="sizeW" value="1080" min="120" max="4000" step="10"></label>
    <label>H <input type="number" id="sizeH" value="1920" min="120" max="4000" step="10"></label>
    <select id="sizePreset">
      <option value="custom">Custom</option>
      <option value="900x1200">3:4 Portrait</option>
      <option value="1080x1920" selected>9:16 Story</option>
      <option value="1080x1080">1:1 Square</option>
      <option value="1600x1000">16:10 Wide</option>
    </select>
  </div>
</div>

<aside class="panel" id="panel">
  <header class="panel-head">
    <div class="panel-title">
      <h1>Paper Hi-Res</h1>
      <p id="statusLine">loading</p>
    </div>
    <button class="ghost-btn" id="resetAll" title="Reset all controls">Reset</button>
  </header>
  <div class="panel-body" id="controls"></div>
  <footer class="panel-foot">
    <button class="pbtn" id="btnReplay">Replay</button>
    <button class="pbtn" id="btnPlay">Pause</button>
    <button class="pbtn" id="btnExport">PNG</button>
    <button class="pbtn" id="btnShare">Share</button>
    <button class="pbtn save" id="btnSave" hidden>Saved</button>
  </footer>
</aside>

<div class="drop-veil" id="dropVeil"><span>Drop images</span></div>
<div class="modal" id="shareModal">
  <div class="modal-card">
    <header><h2>Share this session</h2><button id="shareClose" aria-label="Close">&times;</button></header>
    <div id="shareBody"></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>

<script>
const __m_rng = (function(){

// Seeded, reproducible randomness. Same seed => same sheet, forever.
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Stateless hash: one deterministic value per (seed, index, salt) triple.
function hash(seed, i, salt){
  return mulberry32((seed * 374761393 + i * 668265263 + salt * 2246822519) >>> 0)();
}

// Signed variant, -1..1
function shash(seed, i, salt){ return hash(seed, i, salt) * 2 - 1; }

// Smooth 1D value noise — used for variation ALONG a crease so the highlight
// breathes instead of running at one constant weight.
function noise1(seed, salt, t){
  const i = Math.floor(t), f = t - i;
  const a = hash(seed, i, salt), b = hash(seed, i + 1, salt);
  const u = f * f * (3 - 2 * f);
  return a + (b - a) * u;
}

// Fractal version — two octaves is enough to stop it reading as a sine wave.
function fbm1(seed, salt, t){
  return noise1(seed, salt, t) * 0.65 + noise1(seed, salt + 977, t * 2.7) * 0.35;
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const APP_BASE = 'https://nnnephirale.github.io/pashu/';

const MAX_EDGE = 1800;
const JPEG_Q = 0.86;

function reencode(img){
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const s = Math.min(1, MAX_EDGE / Math.max(iw, ih));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(iw * s));
  cv.height = Math.max(1, Math.round(ih * s));
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', JPEG_Q);
}

function serialize({ settings, size, photos }){
  return {
    v: 1,
    created: new Date().toISOString(),
    settings,
    size,
    images: photos.map(p => p.demo
      ? { d: p.demoIndex, on: p.on }
      : { u: reencode(p.img), on: p.on })
  };
}

async function publish(session){
  const r = await fetch(API_BASE + '/api/session', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(session)
  });
  if (!r.ok) throw new Error(`Publish failed (${r.status})`);
  return r.json();                       // { id, key }
}

// Overwrites in place, so the shared URL stays the same forever.
async function save(id, key, session){
  const r = await fetch(`${API_BASE}/api/session/${encodeURIComponent(id)}`, {
    method: 'PUT',
    headers: { 'content-type': 'application/json', 'x-edit-key': key || '' },
    body: JSON.stringify(session)
  });
  if (r.status === 403) throw new Error('This link can view but not edit this session.');
  if (!r.ok) throw new Error(`Save failed (${r.status})`);
  return r.json();
}

async function load(id){
  const r = await fetch(`${API_BASE}/api/session/${encodeURIComponent(id)}`);
  if (!r.ok) throw new Error(r.status === 404 ? 'Session not found' : `Load failed (${r.status})`);
  return r.json();
}

// Editable is s, play-only is v. Path form works on the Worker; query form works
// anywhere, including GitHub Pages under a project subpath, so that's what Share
// hands out.
function routeOf(loc = location){
  const q = new URLSearchParams(loc.search);
  const key = q.get('k') || '';
  for (const [k, mode] of [['s', 'edit'], ['v', 'view']]){
    const id = q.get(k);
    if (id && /^[A-Za-z0-9_-]{4,40}$/.test(id))
      return { mode, id, key: mode === 'edit' ? key : '' };
  }
  const m = /^(?:.*)\/([sv])\/([A-Za-z0-9_-]{4,40})\/?$/.exec(loc.pathname);
  return m ? { mode: m[1] === 'v' ? 'view' : 'edit', id: m[2], key } : null;
}

// Where a shared link should point. Served over the web, that's here; opened
// from a local file, fall back to the published app.
function appBase(){
  if (location.protocol === 'http:' || location.protocol === 'https:')
    return location.origin + location.pathname.replace(/\/(index\.html)?$/, '/');
  return APP_BASE.replace(/\/?$/, '/');
}

// What counts as "changed". Deliberately excludes anything transient (the frame
// counter, play state) — only the document itself.
function signature({ settings, size, photos }){
  return JSON.stringify({
    s: settings,
    z: size,
    i: photos.map(p => [p.demo ? 'd' + p.demoIndex : p.src, p.on ? 1 : 0])
  });
}

const canPublish = () => true;

return { serialize, publish, save, load, routeOf, appBase, signature, canPublish };
})();

// Reveal schedule: when each panel first appears during assembly.
function revealFrameFor(p, cols, rows, total, fps, seed){
  const order = C.get('revealOrder');
  const stagger = C.get('revealStagger');
  const dur = C.get('revealDuration') * fps;
  let t;
  if (order === 'reading')      t = total > 1 ? p.id / (total - 1) : 0;
  else if (order === 'columns') t = cols > 1 ? p.i / (cols - 1) : 0;
  else if (order === 'centre'){
    const dx = (p.i + 0.5) / cols - 0.5, dy = (p.j + 0.5) / rows - 0.5;
    t = clamp(Math.hypot(dx, dy) / 0.72, 0, 1);
  } else t = hash(seed, p.id, 71);
  return t * stagger * dur;
}

function advance(){
  frame++;
  const seed = C.get('seed');
  // Paper selection now happens in render() — "One Paper" holds; "Per Image"
  // picks a fresh paper (from the un-muted choices) whenever the shown image
  // changes. See render().

  // segment shuffling
  const n = activePhotos().length;
  const runMode = C.get('mode');
  const shuffles = runMode === 'shuffle' || runMode === 'both';
  if (shuffles && n > 1 && grid && blocks.length){
    const hold = C.get('holdFrames');
    const hj = C.get('holdJitter');
    const chance = C.get('swapChance');
    const fps = C.get('fps');
    const assembleEnd = runMode === 'both' ? assemblyLength(fps) : 0;
    if (frame >= assembleEnd){
      segments.forEach((s, i) => {
        const wait = Math.max(1, Math.round(hold * (1 - hj * 0.5 + hash(seed, i * 13 + frame, 81) * hj)));
        if (frame - s.lastSwap < wait) return;
        if (hash(seed, i * 7 + frame, 83) > chance){ s.lastSwap = frame; return; }

        if (C.get('shuffleMode') === 'sequential') next = (s.cur + 1) % n;

          if (next === s.cur) next = (next + 1) % n;
        }
        s.prev = s.cur; s.cur = next; s.lastSwap = frame; s.entryAt = frame;
      });
    }
  }

  if (C.get('loop') && grid){
    const fps = C.get('fps');
    const len = assemblyLength(fps) + Math.round(fps * 1.4);
    if (runMode === 'assemble' && frame >= len) resetTimeline();
  }
}

// Sweep needs a strict laying ORDER, not the normalised 0..1 offset the
// assemble reveal uses — tile 5 must land after tile 4 and before tile 6.
function assignSweepRanks(){
  const order = C.get('mode') === 'sweep' ? 'reading' : C.get('revealOrder');
  const seed = C.get('seed');
  const arr = blocks.slice();
  if (order === 'columns') arr.sort((a, b) => (a.i - b.i) || (a.j - b.j));
  else if (order === 'centre'){
    const d = (b) => Math.hypot((b.cx / grid.w) - 0.5, (b.cy / grid.h) - 0.5);
    arr.sort((a, b) => d(a) - d(b));
  }
  else if (order === 'scattered')
    arr.sort((a, b) => hash(seed, a.id, 71) - hash(seed, b.id, 71));
  // 'reading' is already the order buildBlocks sorts into: row by row, then down
  arr.forEach((b, k) => { b.rank = k; });
}

function assemblyLength(fps){
  if (!grid) return 0;
  let m = 0;
  for (const b of blocks)
    m = Math.max(m, revealFrameFor(b, grid.cols, grid.rows, blocks.length, fps, C.get('seed')));
  return m + C.get('entryFrames') + 1;
}

// How many frames make up "one full animation" — the count the PNG export walks.
// Sequential has an exact period (every image laid down once, then it repeats).
// Randomized never repeats — it assembles, then jitters forever — so we take the
// assembly plus a tail of shuffle frames long enough to read as one full cycle.
function loopLength(){
  const fps = C.get('fps');
  if (C.get('mode') === 'sweep'){
    const n = Math.max(1, activePhotos().length);
    const cycleLen = blocks.length + C.get('sweepHold');
    const step = C.get('entry') === 'snap'
      ? Math.max(1, C.get('tileBeat'))
      : Math.max(1, C.get('tileBeat'), C.get('entryFrames'));
    return Math.max(1, n * cycleLen * step);
  }
  const tail = Math.max(Math.round(fps * 2), C.get('holdFrames') * 4);
  return Math.max(1, Math.ceil(assemblyLength(fps)) + tail);
}

// Which image is on screen right now — used so "Per Image" paper changes in step

    const step = C.get('entry') === 'snap'

    const cycleLen = Math.max(1, blocks.length + C.get('sweepHold'));
    return Math.floor(Math.floor(frame / step) / cycleLen);

  return segments[0] ? segments[0].cur : 0;
}

// ── drawing ──────────────────────────────────────────────────────────────────
function drawBlockPanel(g, b, p, entry, alpha, sc, dx, dy, cw, ch, rotJit = 0){
  const list = activePhotos();
  if (!list.length) return;
  const img = list[clamp(entry, 0, list.length - 1)].img;
  const fit = C.get('imageFit');
  const ps = C.get('printScale');
  pbx.save();
  pbx.globalAlpha = alpha;
  // Transform BEFORE clipping, so the tile's aperture moves with its content.
  // Clip first and the image merely slides under a fixed window — every tile
  // then reads as one rigid sheet. Moving both is what makes each tile look
  // like its own scrap of paper, with the small gaps and overlaps to match.
  // Rotation and tear are FIXED per panel (constant through the animation).
  pbx.translate(p.cx + dx, p.cy + dy);
  pbx.rotate((p.rot * C.get('panelRotate') + rotJit) * Math.PI / 180);
  pbx.scale(sc, sc);
  pbx.translate(-p.cx, -p.cy);
  pbx.clip(F.panelPath(g, p, C.get('tear'), 0.75));
  if (fit === 'sheet'){
    const w = cw * ps, h = ch * ps;
    P.drawCover(pbx, img, (cw - w) / 2, (ch - h) / 2, w, h);
  } else {
    const w = b.w * ps * 1.04, h = b.h * ps * 1.04;
    P.drawCover(pbx, img, b.cx - w / 2, b.cy - h / 2, w, h);
  }
  pbx.restore();
}

function render(){

  const seed = C.get('seed');
  const runMode = C.get('mode');
  const cols = C.get('cols'), rows = C.get('rows');
  // Sweep lays one image per grid cell. Merged blocks would span rows, so a
  // block anchored in row 0 would fill part of row 1 before row 0 finished —
  // which breaks the row-by-row read the mode exists to produce.
  const sweepMode = runMode === 'sweep';
  const grouping = sweepMode ? 0 : C.get('grouping');
  const groupCap = sweepMode ? 1 : C.get('groupCap');
  // The grid is a fixed, even tessellation — built once and reused (jitter,
  // waver and skew are pinned to 0), so cells never change size through the run.
  const gj = C.get('gridJitter'), fw = C.get('foldWaver'), fs = C.get('foldSkew');
  const key = [cols, rows, cw, ch, seed, gj, fw, fs, grouping, groupCap,
               sweepMode ? 'reading' : C.get('revealOrder')].join('|');
  if (key !== gridKey){
    grid = F.buildGrid({ cols, rows, w: cw, h: ch, seed,
      gridJitter: gj, foldWaver: fw, foldSkew: fs });
    blocks = F.buildBlocks(grid, seed, grouping, groupCap);
    assignSweepRanks();
    gridKey = key;
  }
  ensureSegments(blocks.length);

  const lightAngle = C.get('lightAngle') * Math.PI / 180;
  const ap = activePapers();
  // Paper: "One Paper" holds on the current (first un-muted) sheet; "Per Image"
  // maps each shown image to one of the un-muted papers, so the sheet changes
  // whenever the image does. Index is into the active (un-muted) list.
  if (ap.length){
    if (C.get('paperSwapMode') === 'perimage'){
      const imgId = currentImageId();
      paperIndex = Math.floor(hash(seed, imgId + 1, 55) * ap.length) % ap.length;
    }
    paperIndex = Math.min(paperIndex, ap.length - 1);
  }
  const paper = ap.length ? ap[paperIndex] : null;
  const sampler = samplerFor(paper);

  // ---- printed layer -------------------------------------------------------
  if (printBuf.width !== cw || printBuf.height !== ch){ printBuf.width = cw; printBuf.height = ch; }
  pbx.clearRect(0, 0, cw, ch);

  const entryFrames = C.get('entryFrames');
  const entryKind = C.get('entry');
  const posJ = C.get('posJitter'), rotJ = C.get('rotJitter');
  const pOff = C.get('panelOffset');
  const basePeek = C.get('basePeek');

  const coverage = runMode === 'sweep' ? 1 : C.get('coverage');
  const covered = (b) => coverage >= 0.999 || hash(seed, b.id, 111) <= coverage;
  drawnThisFrame = [];
  if (trace) drawn = [];

  if (runMode === 'sweep'){
    // One image lays itself down tile by tile in strict order. Only when the
    // LAST tile has landed (plus a hold) does the next image start over the top.
    const n = activePhotos().length;
    // ONE segment animates in at a time: each tile occupies enough frames for its
    // whole entry to finish before the next tile starts. Snap needs only tileBeat.
    const tileBeat = C.get('tileBeat');
    const step = entryKind === 'snap'
      ? Math.max(1, tileBeat) : Math.max(1, tileBeat, entryFrames);
    const cycleLen = blocks.length + C.get('sweepHold');
    const tick = Math.floor(frame / step);
    let cycle = Math.floor(tick / cycleLen);
    let pos = tick % cycleLen;
    // Settle on the final image rather than wrapping when Loop is off
    if (!C.get('loop') && n > 1 && cycle >= n - 1){ cycle = n - 2; pos = cycleLen; }

    // The previously-completed image, laid flat and frozen under everything, so
    // the gaps left as a tile jitters or animates in reveal it instead of paper.
    const baseImg = ((cycle % n) + n) % n;

    for (const b of blocks){
      if (!covered(b)) continue;
      const laid = b.rank < pos;
      // The sheet always starts FULL: at cycle 0 every tile already carries
      // image 0 and the sweep lays image 1 over it. A tile is never blank.
      const shownCycle = laid ? cycle + 1 : cycle;
      const img = ((shownCycle % n) + n) % n;
      drawnThisFrame.push([b.rank, img]);
      if (trace) drawn.push([b.rank, img]);

      const landedAt = ((laid ? cycle : cycle - 1) * cycleLen + b.rank) * step;
      const since = Math.max(frame - landedAt, 0);
      const ef = entryKind === 'snap' ? 0 : entryFrames;
      const e = ef > 0 ? clamp(since / ef, 0, 1) : 1;
      const ee = easeOutCubic(e);

      let alpha = 1, sc = 1, ex = 0, ey = 0;
      if (entryKind === 'fade') alpha = ee;
      else if (entryKind === 'grow'){ alpha = ee; sc = 0.82 + 0.18 * ee; }
      else if (entryKind === 'slide'){
        alpha = Math.min(1, ee * 1.4);
        const dir = Math.floor(hash(seed, b.id, 93) * 4);
        const d = (1 - ee) * Math.max(b.w, b.h) * 0.55;
        if (dir === 0) ex = -d; else if (dir === 1) ex = d;
        else if (dir === 2) ey = -d; else ey = d;
      }
      for (const p of b.panels){
        const jx = shash(seed, p.idx * 3 + frame, 51) * posJ;
        const jy = shash(seed, p.idx * 3 + frame, 52) * posJ;
        const jr = shash(seed, p.idx * 5 + frame, 56) * rotJ;
        // frozen base fills this cell first — no jitter, no entry — then the
        // current tile animates/jitters over it, so every gap reveals an image
        if (basePeek)
          drawBlockPanel(grid, b, p, baseImg, 1, 1, p.offX * pOff, p.offY * pOff, cw, ch, 0);
        drawBlockPanel(grid, b, p, img, alpha, sc,
          p.offX * pOff + ex + jx, p.offY * pOff + ey + jy, cw, ch, jr);
      }
    }
  } else {
  for (const b of blocks){
    const st = segments[b.id];
    if (!st) continue;
    if (!covered(b)) continue;

    const revealAt = (runMode === 'shuffle')
      ? 0 : revealFrameFor(b, cols, rows, blocks.length, fps, seed);
    if (frame < revealAt) continue;

    const since = Math.max(frame - Math.max(revealAt, st.entryAt), 0);
    const e = entryFrames > 0 ? clamp(since / entryFrames, 0, 1) : 1;
    const ee = easeOutCubic(e);

    let alpha = 1, sc = 1, ex = 0, ey = 0;
    if (entryKind === 'fade') alpha = ee;
    else if (entryKind === 'grow'){ alpha = ee; sc = 0.82 + 0.18 * ee; }
    else if (entryKind === 'slide'){
      alpha = Math.min(1, ee * 1.4);
      const dir = Math.floor(hash(seed, b.id, 93) * 4);
      const d = (1 - ee) * Math.max(b.w, b.h) * 0.55;
      if (dir === 0) ex = -d; else if (dir === 1) ex = d;
      else if (dir === 2) ey = -d; else ey = d;
    }

    drawnThisFrame.push([b.rank, st.cur]);
    if (trace) drawn.push([b.rank, st.cur]);
    // the image this tile last held, laid flat and frozen underneath
    const baseImg = st.prev >= 0 ? st.prev : st.cur;
    for (const p of b.panels){
      const jx = shash(seed, p.idx * 3 + frame, 51) * posJ;
      const jy = shash(seed, p.idx * 3 + frame, 52) * posJ;
      const jr = shash(seed, p.idx * 5 + frame, 56) * rotJ;
      if (basePeek)
        drawBlockPanel(grid, b, p, baseImg, 1, 1, p.offX * pOff, p.offY * pOff, cw, ch, 0);
      drawBlockPanel(grid, b, p, st.cur, alpha, sc,
        p.offX * pOff + ex + jx, p.offY * pOff + ey + jy, cw, ch, jr);
    }
  }
  }

  // press the print into the sheet (paper distortion removed in this build)
  let layer = printBuf;
  const uneven = C.get('unevenness');
  if (uneven > 0.001)
    layer = IMP.applyPrintWear(layer, { unevenness: uneven, seed }, cw, ch);

  // ---- composite -----------------------------------------------------------
  ctx.clearRect(0, 0, cw, ch);
  const sh = IMP.shakeFor(seed, frame, C.get('cameraShake'));
  ctx.save();
  ctx.translate(cw/2 + sh.x, ch/2 + sh.y);
  ctx.rotate(sh.r);
  ctx.translate(-cw/2, -ch/2);

  ctx.fillStyle = '#EDE9E0';
  ctx.fillRect(0, 0, cw, ch);
  if (paper) P.drawSheet(ctx, paper.img, C.get('paperScale'), cw, ch);

  ctx.save();
  ctx.globalCompositeOperation = C.get('printBlend');
  ctx.globalAlpha = C.get('printOpacity');
  ctx.drawImage(layer, 0, 0);
  ctx.restore();

  if (sampler && paper)
    P.paintPaperLight(ctx, sampler, paper.img,
      { lighting: C.get('paperLighting'), contrast: C.get('lightingContrast'),
        paperScale: C.get('paperScale') }, cw, ch);

  // Tone, lift and creases don't change between stop-motion beats — they're
  // baked once into three layers and blitted.
  F.paintFoldLayers(ctx, F.buildFoldLayers(grid, {
    tone: C.get('panelTone'), highlight: C.get('creaseHighlight'),
    shadow: C.get('creaseShadow'), width: C.get('creaseWidth'),
    softness: C.get('creaseSoft'), variance: C.get('creaseVary'),
    lift: C.get('panelLift'), lightAngle }));

  ctx.restore();

  IMP.paintGrainAndVignette(ctx, {
    grain: C.get('filmGrain'), vignette: C.get('vignette'), frame }, cw, ch);

  if (C.get('debugTiles')){
    const shown = new Map(drawnThisFrame);
    ctx.save();
    ctx.font = `${Math.round(Math.min(cw, ch) / 26)}px ui-monospace, monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const b of blocks){
      const img = shown.has(b.rank) ? shown.get(b.rank) : '-';
      const t = `${b.rank + 1}\u2009\u2192\u2009${img}`;
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.strokeText(t, b.cx, b.cy);
      ctx.fillStyle = '#B4746E';
      ctx.fillText(t, b.cx, b.cy);
    }
    ctx.restore();
  }

  status();
}

function tick(ts){
  const fps = C.get('fps');
  if (!lastTs) lastTs = ts;
  const dt = ts - lastTs; lastTs = ts;
  if (playing){
    accum += dt;
    const step = 1000 / fps;
    let guard = 0;
    while (accum >= step && guard++ < 8){ accum -= step; advance(); dirty = true; }
    if (guard >= 8) accum = 0;          // tab was backgrounded — don't catch up
  }
  if (dirty){ dirty = false; render(); }
  requestAnimationFrame(tick);
}

const statusEl = document.getElementById('statusLine');
function status(){
  let extra = '';
  if (C.get('mode') === 'sweep' && blocks.length && activePhotos().length){
    const cycleLen = blocks.length + C.get('sweepHold');
    const step = C.get('entry') === 'snap'
      ? Math.max(1, C.get('tileBeat'))
      : Math.max(1, C.get('tileBeat'), C.get('entryFrames'));
    const tick = Math.floor(frame / step);
    const pos = Math.min(blocks.length, tick % cycleLen);
    extra = ` · tile ${pos}/${blocks.length}`;
  }
  statusEl.textContent =
    `${grid ? grid.panels.length : 0} segments · ${activePhotos().length} images · ` +
    `f${frame} @${C.get('fps')}fps${extra} · b${BUILD}`;
}

// ── sizing ───────────────────────────────────────────────────────────────────
const sizeW = document.getElementById('sizeW');
const sizeH = document.getElementById('sizeH');
const sizePreset = document.getElementById('sizePreset');
function applySize(){
  const w = clamp(parseInt(sizeW.value) || 1080, 120, 4000);
  const h = clamp(parseInt(sizeH.value) || 1920, 120, 4000);
  C.setExtra('size', { w, h, preset: sizePreset.value });
  canvas.width = w; canvas.height = h;
  fitCanvas();
  gridKey = '';
  dirty = true;
}
function fitCanvas(){
  const stage = document.getElementById('stage');
  const pad = document.body.classList.contains('view-only') ? 0 : 88;
  const aw = stage.clientWidth - pad, ah = stage.clientHeight - pad;
  // Never let a zero-size measurement stick: a hidden or not-yet-laid-out stage
  // would pin the canvas at 0px and it would stay there even once real space
  // appeared, because nothing recomputes it.
  if (aw <= 0 || ah <= 0) return;
  const s = Math.min(aw / canvas.width, ah / canvas.height,
                     document.body.classList.contains('view-only') ? 4 : 1.2);
  canvas.style.width = Math.round(canvas.width * s) + 'px';
  canvas.style.height = Math.round(canvas.height * s) + 'px';
}
sizeW.addEventListener('change', () => { sizePreset.value = 'custom'; applySize(); });
sizeH.addEventListener('change', () => { sizePreset.value = 'custom'; applySize(); });
sizePreset.addEventListener('change', () => {
  if (sizePreset.value === 'custom') return;
  const [w, h] = sizePreset.value.split('x');
  sizeW.value = w; sizeH.value = h; applySize();
});
window.addEventListener('resize', fitCanvas);
if (window.ResizeObserver)
  new ResizeObserver(() => fitCanvas()).observe(document.getElementById('stage'));

// ── sessions ────────────────────────────────────────────────────────────────
// A published session owns its URL forever. Opening one puts the app in session
// mode: edits are live but transient until Save writes them back to the same id.
let session = null;            // { id, key, sig }
const docNow = () => ({
  settings: C.all(),
  size: { w: canvas.width, h: canvas.height, preset: sizePreset.value },
  photos
});
const isDirty = () => !!session && SESSION.signature(docNow()) !== session.sig;

function markClean(){
  if (session) session.sig = SESSION.signature(docNow());
  syncSaveBtn();
}
// The footer's primary action must never read "Share" when Save is what's
// wanted. Three states: no session, a session we can write to, and a session we
// can only read (an editable link opened without its key, or one published
// before edit keys existed) — where the honest action is to fork a copy.
// In a session, the id IS the document's name — show it instead of the app name.
function syncTitle(){
  const h = document.querySelector('.panel-title h1');
  if (h) h.textContent = session ? session.id : 'Paper Hi-Res';
  document.title = session ? `${session.id} \u00b7 Paper Hi-Res`
                           : 'Paper Hi-Res';
}

function syncSaveBtn(){
  syncTitle();
  const save = document.getElementById('btnSave');
  const share = document.getElementById('btnShare');
  if (!save || !share) return;
  const owned = !!session && !!session.key;
  const dirty = isDirty();

  save.hidden = !owned;
  share.hidden = false;

  if (owned){
    save.textContent = dirty ? 'Save *' : 'Saved';
    save.classList.toggle('dirty', dirty);
    save.disabled = !dirty;
    share.textContent = 'Links';
    share.title = 'Show this session\u2019s links';
  } else if (session){
    share.textContent = 'Save a copy';
    share.title = 'This link can\u2019t overwrite its session \u2014 publish a new one';
  } else {
    share.textContent = 'Share';
    share.removeAttribute('title');
  }
  document.body.classList.toggle('unsaved', dirty);
}
C.onAny(() => syncSaveBtn());

// Leaving with unsaved edits throws them away, so say so.
window.addEventListener('beforeunload', (e) => {
  if (!isDirty()) return;
  e.preventDefault();
  e.returnValue = '';
});
const shareModal = document.getElementById('shareModal');
const shareBody = document.getElementById('shareBody');
const closeShare = () => shareModal.classList.remove('on');
document.getElementById('shareClose').addEventListener('click', closeShare);
shareModal.addEventListener('click', (e) => { if (e.target === shareModal) closeShare(); });

function urlRow(label, url, note){
  const id = 'u' + Math.random().toString(36).slice(2, 8);
  return `<div class="url-row">
      <div class="url-label">${label}<span>${note}</span></div>
      <div class="url-box"><input readonly value="${url}" id="${id}">
        <button data-copy="${id}">Copy</button></div>
    </div>`;
}

document.getElementById('btnSave').addEventListener('click', async () => {
  if (!session || !session.key) return;
  const btn = document.getElementById('btnSave');
  btn.disabled = true; btn.textContent = 'Saving\u2026';
  try {
    await SESSION.save(session.id, session.key, SESSION.serialize(docNow()));
    C.setBaseline(C.all());          // Reset now returns to what was just saved
    markClean();
    toast('Session saved');
  } catch (err){
    toast(err.message);
    syncSaveBtn();
  }
});

function showLinks(id, key, extraNote){
  const base = SESSION.appBase();
  shareBody.innerHTML =
    urlRow('Editable', `${base}?s=${id}${key ? '&k=' + key : ''}`,
           key ? 'dials open \u00b7 Save writes back here' : 'dials open \u00b7 cannot overwrite') +
    urlRow('Play only', `${base}?v=${id}`, 'no panel, just the animation') +
    `<p class="share-note">${extraNote}</p>`;
  shareBody.querySelectorAll('[data-copy]').forEach(b =>
    b.addEventListener('click', () => {
      const inp = document.getElementById(b.dataset.copy);
      inp.select();
      navigator.clipboard.writeText(inp.value).then(() => {
        b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1600);
      });
    }));
}

document.getElementById('btnShare').addEventListener('click', async () => {
  // an owned session already has its links — don't mint a second one
  if (session && session.key){
    showLinks(session.id, session.key,
      'These URLs are permanent. Save updates this session in place. The editable ' +
      'link carries its edit key, so anyone you send it to can overwrite it; the ' +
      'play-only link cannot.');
    shareModal.classList.add('on');
    return;
  }
  shareBody.innerHTML = `<p class="share-note">Packing session\u2026</p>`;
  shareModal.classList.add('on');
  try {
    const payload = SESSION.serialize({
      settings: C.all(),
      size: { w: canvas.width, h: canvas.height, preset: sizePreset.value },
      photos
    });
    const { id, key } = await SESSION.publish(payload);
    session = { id, key, sig: SESSION.signature(docNow()) };
    C.setBaseline(C.all());
    C.setPersist(false);
    // point the address bar at what was just published, so a reload reopens it
    history.replaceState(null, '', `${location.pathname}?s=${id}&k=${key}`);
    syncSaveBtn();
    showLinks(id, key,
      'These URLs are permanent \u2014 Save updates this session in place rather ' +
      'than making a new one. The editable link carries its edit key, so anyone ' +
      'you send it to can overwrite it; the play-only link cannot.');
  } catch (err){
    shareBody.innerHTML = `<p class="share-note err">${err.message}</p>`;
  }
});

async function applySession(sess, mode, route){
  // set the layout mode first — fitCanvas measures the stage, which is a
  // different size once the panel is gone
  if (mode === 'view') document.body.classList.add('view-only');
  if (sess.size && Number.isFinite(sess.size.w)){
    sizeW.value = sess.size.w; sizeH.value = sess.size.h;
    if (sess.size.preset) sizePreset.value = sess.size.preset;
    applySize();
  }
  photos = [];
  for (const e of (sess.images || [])){
    const src = (e.d !== undefined && DEMO[e.d]) ? DEMO[e.d] : e.u;
    if (!src) continue;
    try {
      const img = await P.loadImage(src);
      photos.push({ src, img, on: e.on !== false, demo: e.d !== undefined, demoIndex: e.d });
    } catch { /* skip */ }
  }
  C.setExtra('demoDismissed', true);
  for (const k in (sess.settings || {})) C.set(k, sess.settings[k]);
  // Reset now returns to the session, not to the app defaults
  C.setBaseline(sess.settings || {});
  refreshStrips();
  gridKey = ''; resetTimeline();
  fitCanvas();
  // edits from here are transient until Save
  C.setPersist(false);
  session = { id: route.id, key: route.key || '', sig: '' };
  markClean();
}

// ── PNG export: every frame of one full loop, numbered, in a single .zip ───────
// Many separate downloads trip the browser's multi-file blocker, so the frames
// are packed into one store-only zip (PNGs are already compressed) and handed
// over as a single file.
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder();
  const u16 = n => new Uint8Array([n & 255, (n >> 8) & 255]);
  const u32 = n => new Uint8Array([n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255]);
  const cat = (...a) => { const o = []; for (const x of a) o.push(...x); return new Uint8Array(o); };
  const parts = [], central = [];
  let offset = 0;
  for (const f of files){
    const name = enc.encode(f.name);
    const crc = crc32(f.data), size = f.data.length;
    const local = cat(u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(size), u32(size), u16(name.length), u16(0), name);
    parts.push(local, f.data);
    central.push(cat(u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(size), u32(size), u16(name.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(offset), name));
    offset += local.length + size;
  }
  let cdSize = 0;
  for (const c of central){ parts.push(c); cdSize += c.length; }
  parts.push(cat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(cdSize), u32(offset), u16(0)));
  return new Blob(parts, { type: 'application/zip' });
}

let exporting = false;
document.getElementById('btnExport').addEventListener('click', async () => {
  if (exporting) return;
  if (!blocks.length || !activePhotos().length){ toast('Nothing to export yet'); return; }
  const btn = document.getElementById('btnExport');
  const label = btn.textContent;
  exporting = true; btn.disabled = true;
  const seed = C.get('seed');
  // Rewind to a clean start, then step frame-by-frame off the render loop.
  const snap = { playing, frame, accum, paperIndex, segments };
  playing = false;
  try {
    const total = Math.max(1, Math.round(loopLength()));
    frame = 0; accum = 0; paperIndex = 0; segments = [];
    // A stop-motion loop holds on the same picture for many beats, so most frames
    // are byte-for-byte repeats. Keep only frames whose pixels differ from the
    // last kept one, then number the survivors consecutively.
    const kept = [];
    const seen = new Set();
    for (let i = 0; i < total; i++){
      if (i > 0) advance();
      dirty = false; render();
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      const data = new Uint8Array(await blob.arrayBuffer());
      const key = crc32(data) + ':' + data.length;
      if (!seen.has(key)){ seen.add(key); kept.push(data); }
      btn.textContent = `${i + 1}/${total}`;
      if ((i & 3) === 0) await new Promise(r => setTimeout(r));   // let the label repaint
    }
    const pad = String(kept.length).length;
    const files = kept.map((data, i) => ({
      name: `frame_${String(i).padStart(pad, '0')}.png`, data }));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zipStore(files));
    a.download = `paper-shuffle-${seed}.zip`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
    toast(`${kept.length} frames saved`);
  } catch (err){
    console.error(err);
    toast('Export failed');
  } finally {
    // restore the live timeline exactly where it was
    playing = snap.playing; frame = snap.frame; accum = snap.accum;
    paperIndex = snap.paperIndex; segments = snap.segments;
    btn.textContent = label; btn.disabled = false; exporting = false;
    dirty = true;
  }
});

const filePick = document.createElement('input');
filePick.type = 'file'; filePick.accept = 'image/*'; filePick.multiple = true;
filePick.addEventListener('change', () => {
  addUserPhotos([...filePick.files].map(f => URL.createObjectURL(f)));
  filePick.value = '';
});
C.onChange('addPhotos', () => filePick.click());

// Explicit escape hatch: bring the placeholders back and let them persist again.
C.onChange('resetPhotos', async () => {
  const before = photos.slice();
  photos = []; refreshStrips();
  await addSources(photos, DEMO, true);
  C.setExtra('demoDismissed', false);
  resetTimeline();
  toast('Demo set loaded', () => {
    photos = before; C.setExtra('demoDismissed', !before.some(p => p.demo));
    refreshStrips(); resetTimeline();
  });
});

C.onChange('clearPhotos', () => {
  if (!photos.length) return toast('Nothing to clear');
  const before = photos.slice();
  const n = before.length;
  photos = [];
  C.setExtra('demoDismissed', true);
  refreshStrips(); resetTimeline();
  toast(`${n} image${n === 1 ? '' : 's'} cleared`, () => {
    photos = before;
    C.setExtra('demoDismissed', !before.some(p => p.demo));
    refreshStrips(); resetTimeline();
  });
});

const veil = document.getElementById('dropVeil');
let dragDepth = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) veil.classList.add('on'); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('dragleave', e => { if (--dragDepth <= 0){ dragDepth = 0; veil.classList.remove('on'); } });
window.addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0; veil.classList.remove('on');
  const files = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  await addUserPhotos(files.map(f => URL.createObjectURL(f)));
});

// Debug handle — the preview pane backgrounds the page, which freezes rAF, so
// verification needs to drive frames by hand.
window.__ps = {
  render, canvas, C,
  step(n = 1){ for (let i = 0; i < n; i++){ advance(); render(); } },
  goto(f){ resetTimeline(); this.step(f); },
  info(){ return { frame, panels: grid ? grid.panels.length : 0,
                   photos: activePhotos().length, papers: activePapers().length,
                   playing }; },
  pause(){ playing = false; },
  setTrace(v){ trace = !!v; },
  drawn(){ return drawn.slice().sort((a, b) => a[0] - b[0]); },
  blocks(){ return blocks.map(b => ({ id: b.id, rank: b.rank, i: b.i, j: b.j })); }
};

// ── boot ─────────────────────────────────────────────────────────────────────
(async function boot(){
  const size = C.getExtra('size');
  if (size && Number.isFinite(size.w) && Number.isFinite(size.h)){
    sizeW.value = clamp(size.w, 120, 4000);
    sizeH.value = clamp(size.h, 120, 4000);
    if (size.preset) sizePreset.value = size.preset;
  }
  applySize();
  syncPlay();
  requestAnimationFrame(tick);
  const route = SESSION.routeOf();
  await addSources(papers, PAPERS, false);
  if (route){
    try {
      await applySession(await SESSION.load(route.id), route.mode, route);
    } catch (err){
      toast(err.message);
      await addSources(photos, DEMO, true);
    }
  } else if (!C.getExtra('demoDismissed')){
    await addSources(photos, DEMO, true);
  }
  resetTimeline();
  fitCanvas();
})();

})();
</script>
